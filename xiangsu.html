<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全宇宙图像穷尽生成器</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 24px;
            color: #00e676;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        canvas {
            border: 2px solid #333;
            background-color: #000;
            max-width: 100%;
            height: auto;
            image-rendering: pixelated; /* 保持像素边缘清晰 */
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background-color: #00e676;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #00b359;
        }

        button:disabled {
            background-color: #555;
            color: #aaa;
            cursor: not-allowed;
        }

        .info {
            margin-top: 15px;
            font-family: monospace;
            font-size: 14px;
            color: #aaa;
            text-align: center;
            max-width: 500px;
            line-height: 1.5;
        }

        .highlight {
            color: #00e676;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>全图像穷尽迭代器</h1>
        <!-- 设定画布实际分辨率为 416 x 640 -->
        <canvas id="imageCanvas" width="416" height="640"></canvas>
        
        <div class="controls">
            <button id="startBtn">开始生成</button>
            <button id="pauseBtn" disabled>暂停</button>
            <label>
                每帧步进像素数: 
                <select id="speedSelect">
                    <option value="1">1 像素 (精准按原意演变)</option>
                    <option value="100">100 像素 (较快)</option>
                    <option value="5000">5000 像素 (肉眼可见大面积变化)</option>
                    <option value="26624">26624 像素 (超快，每次变更10%画面)</option>
                </select>
            </label>
        </div>

        <div class="info">
            <div id="pixelStatus">当前正在迭代第 <span class="highlight">0</span> 个像素的颜色</div>
            <div id="counterStatus">已生成图片总数: <span class="highlight">0</span></div>
            <p style="font-size: 11px; color: #666; margin-top: 10px;">
                注：因为总组合数高达 4096^266240，由于前面的像素需要循环完 4096 次右侧像素才会进位，画面主要表现为左上角首个像素的剧烈闪烁。可以通过调节“步进像素数”来加速大面积进位过程。
            </p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const speedSelect = document.getElementById('speedSelect');
        const pixelStatus = document.getElementById('pixelStatus');
        const counterStatus = document.getElementById('counterStatus');

        const WIDTH = 416;
        const HEIGHT = 640;
        const TOTAL_PIXELS = WIDTH * HEIGHT;
        const TOTAL_COLORS = 4096; // 4096种颜色

        // 用一个数组存储每个像素当前对应的颜色索引 (0 到 4095)
        // 按照你的要求，这相当于一个 4096 进制的超巨大计数器
        const pixelColors = new Uint16Array(TOTAL_PIXELS); 

        // 预先生成 4096 种颜色，采用 12-bit RGB 空间 (R, G, B 各 4 位)
        const colorTable = new Uint8ClampedArray(TOTAL_COLORS * 3);
        for (let i = 0; i < TOTAL_COLORS; i++) {
            // 将 0-4095 均匀映射到 0-255 的 RGB 空间
            const r = ((i >> 8) & 0xF) * 17; // 高 4 位
            const g = ((i >> 4) & 0xF) * 17; // 中 4 位
            const b = (i & 0xF) * 17; // 低 4 位
            colorTable[i * 3] = r;
            colorTable[i * 3 + 1] = g;
            colorTable[i * 3 + 2] = b;
        }

        // 初始化 Canvas 图像数据缓冲区
        const imageData = ctx.createImageData(WIDTH, HEIGHT);
        const data = imageData.data;
        // 初始化所有像素为不透明 (Alpha = 255)
        for (let i = 3; i < data.length; i += 4) {
            data[i] = 255;
        }

        let isRunning = false;
        let totalImagesGenerated = 0n; // 使用 BigInt 记录大数字
        let animationFrameId = null;

        // 将当前的像素颜色状态渲染到 Canvas 上
        function render() {
            for (let i = 0; i < TOTAL_PIXELS; i++) {
                const colorIdx = pixelColors[i];
                const r = colorTable[colorIdx * 3];
                const g = colorTable[colorIdx * 3 + 1];
                const b = colorTable[colorIdx * 3 + 2];
                
                const canvasIdx = i * 4;
                data[canvasIdx] = r;
                data[canvasIdx + 1] = g;
                data[canvasIdx + 2] = b;
            }
            ctx.putImageData(imageData, 0, 0);
        }

        // 核心进位逻辑：类似于加法计数器，从第一个像素（低位）开始加 1，满 4096 则向下一个像素进位
        function incrementCounter(steps) {
            let activePixel = 0;
            
            // 为了能看到明显的变化，允许一次性增加多个步长（相当于快进）
            for (let s = 0; s < steps; s++) {
                let pointer = 0;
                pixelColors[pointer]++;
                
                // 处理进位逻辑
                while (pixelColors[pointer] >= TOTAL_COLORS) {
                    pixelColors[pointer] = 0; // 当前像素清零
                    pointer++; // 进位到下一个像素
                    
                    if (pointer >= TOTAL_PIXELS) {
                        // 穷举完所有图片，重置并停止
                        isRunning = false;
                        alert("奇迹发生！已穷举完所有可能的图片！");
                        return 0;
                    }
                    pixelColors[pointer]++;
                }
                if (pointer > activePixel) {
                    activePixel = pointer;
                }
                totalImagesGenerated++;
            }
            return activePixel;
        }

        // 主循环循环
        function loop() {
            if (!isRunning) return;

            const steps = parseInt(speedSelect.value);
            const highestImpactedPixel = incrementCounter(steps);

            render();

            // 更新状态界面
            pixelStatus.innerHTML = `当前最高发生变动的像素位置: <span class="highlight">${highestImpactedPixel}</span> / ${TOTAL_PIXELS}`;
            counterStatus.innerHTML = `已生成图片总数: <span class="highlight">${totalImagesGenerated.toString()}</span>`;

            animationFrameId = requestAnimationFrame(loop);
        }

        // 控制器事件
        startBtn.addEventListener('click', () => {
            if (!isRunning) {
                isRunning = true;
                startBtn.disabled = true;
                pauseBtn.disabled = false;
                loop();
            }
        });

        pauseBtn.addEventListener('click', () => {
            if (isRunning) {
                isRunning = false;
                startBtn.disabled = false;
                pauseBtn.disabled = true;
                cancelAnimationFrame(animationFrameId);
            }
        });

        // 首次渲染初始画面（全黑）
        render();
    </script>
</body>
</html>
